
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "5557:1433"
    volumes:
      - mssqldata:/var/opt/mssql

  adminer:
    image: adminer:latest
    container_name: saas_adminer
    restart: "no"
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  mssqldata:
